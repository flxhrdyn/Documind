version: "3.8"

services:
  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LLAMA_CLOUD_API_KEY=${LLAMA_CLOUD_API_KEY}
      - INVENIOAI_API_KEY=${INVENIOAI_API_KEY:-}
      - CACHE_TYPE=redis
      - REDIS_URL=redis://redis:6379/0
      - INVENIOAI_LLM_MODEL=${INVENIOAI_LLM_MODEL:-openai/gpt-oss-20b}
      - HF_HOME=/app/.cache/huggingface
      - FASTEMBED_CACHE_PATH=/app/.cache/fastembed
    volumes:
      - ./backend/.cache:/app/.cache
      - ./backend/qdrant_storage:/app/qdrant_storage
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
    ports:
      - "8501:8501"
    environment:
      # Pass internal docker network backend URL to Streamlit
      - INVENIOAI_API_BASE_URL=http://backend:8000
      - INVENIOAI_API_KEY=${INVENIOAI_API_KEY:-}
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    # No host port mapping: only `backend` needs Redis, reached over the
    # internal Docker network via the `redis` service name. Exposing 6379 to
    # the host would put an unauthenticated Redis instance on the network.
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  redis_data:
